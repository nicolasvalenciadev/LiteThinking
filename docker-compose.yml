version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: litethinking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litethinking_db
      POSTGRES_USER: litethinking_user
      POSTGRES_PASSWORD: litethinking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litethinking_user -d litethinking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./backend/auth-service
    container_name: litethinking-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: litethinking_db
      DB_USER: litethinking_user
      DB_PASSWORD: litethinking_pass
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckxpdGVUaGlua2luZ1Byb2plY3QyMDI0ISFAQCMkJV4mKg==
    depends_on:
      postgres:
        condition: service_healthy

  company-service:
    build: ./backend/company-service
    container_name: litethinking-company
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: litethinking_db
      DB_USER: litethinking_user
      DB_PASSWORD: litethinking_pass
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./backend/product-service
    container_name: litethinking-product
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: litethinking_db
      DB_USER: litethinking_user
      DB_PASSWORD: litethinking_pass
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: ./backend/inventory-service
    container_name: litethinking-inventory
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: litethinking_db
      DB_USER: litethinking_user
      DB_PASSWORD: litethinking_pass
      COMPANY_SERVICE_URL: http://company-service:8082
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      company-service:
        condition: service_started

  api-gateway:
    build: ./backend/api-gateway
    container_name: litethinking-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckxpdGVUaGlua2luZ1Byb2plY3QyMDI0ISFAQCMkJV4mKg==
      AUTH_SERVICE_URL: http://auth-service:8081
      COMPANY_SERVICE_URL: http://company-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    depends_on:
      - auth-service
      - company-service
      - product-service
      - inventory-service

  frontend:
    build: ./frontend/litethinking-ui
    container_name: litethinking-frontend
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
    driver: local
