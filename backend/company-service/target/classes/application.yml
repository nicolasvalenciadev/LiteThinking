server:
  port: 8082

spring:
  application:
    name: company-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:litethinking_db}
    username: ${DB_USER:litethinking_user}
    password: ${DB_PASSWORD:litethinking_pass}
  jpa:
    ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
