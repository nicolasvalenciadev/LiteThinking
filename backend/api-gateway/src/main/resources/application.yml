server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:thisIsADefaultSecretKeyForDevelopmentOnly1234567890}

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  company-url: ${COMPANY_SERVICE_URL:http://localhost:8082}
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
